name: verify-commitments

on:
  push:
  pull_request:

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: 敏感信息预检（私钥/令牌/路径）
        run: |
          set -e
          if grep -rInE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}' \
             --exclude-dir=.git --exclude=scripts/preflight_scan.ps1 . ; then
            echo "::error::发现疑似私钥或令牌"; exit 1
          fi
      - name: 承诺件自检（哈希 + 签名 + 跨文件一致）
        run: python scripts/selfcheck.py
      - name: 浏览器复验页算法一致性（规范字节/指纹）
        run: node scripts/canon_check.js attest/CLAIM.json attest/CLAIM.json.sig attest/CLAIMANT_PUBKEY.pem
      - name: 存证证书与索引数值一致
        run: |
          set -e
          root=$(python -c "import json;print(json.load(open('index.json'))['commitments']['merkle_root'])")
          grep -q "$root" certificate.html || { echo "::error::certificate.html 未含当前根值"; exit 1; }
          grep -q '2683' certificate.html || { echo "::error::certificate.html 未含文件数"; exit 1; }
          echo "certificate.html 与 index.json 根值一致"
      - name: 见证回执模板不得过期
        run: |
          set -e
          root=$(python -c "import json;print(json.load(open('index.json'))['commitments']['merkle_root'])")
          tpl=$(python -c "import json;d=json.load(open('attest/WITNESS_RECEIPT_TEMPLATE.json'));print([i['value_claimed'] for i in d['items_checked'] if i['name']=='文件集合 Merkle 根'][0])")
          [ "$root" = "$tpl" ] || { echo "::error::回执模板的根值与当前索引不一致（模板过期，见证人会核出假阴性）"; exit 1; }
          echo "回执模板根值与索引一致"
      - name: Rekor v2 条目自算入证与验签
        run: python scripts/verify_rekor_v2.py
      - name: Rekor v2 checkpoint 联签数（外部见证）
        run: |
          set -e
          n=$(grep -c '^— ' attest/REKOR_V2_CHECKPOINT.txt || true)
          echo "checkpoint 联签行数=$n"
          [ "$n" -ge 2 ] || { echo "::error::checkpoint 联签不足 2 行"; exit 1; }
      - name: 复验页实际加载（无头浏览器跑一遍 verify.html）
        run: |
          set -u
          BIN=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$BIN" ]; then echo "::warning::本 runner 无 Chrome，跳过 verify.html 实跑"; exit 0; fi
          python -m http.server 8099 --bind 127.0.0.1 &
          SRV=$!
          sleep 2
          out=$($BIN --headless=new --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom http://127.0.0.1:8099/verify.html 2>/dev/null || true)
          kill $SRV 2>/dev/null || true
          stamp=$(echo "$out" | grep -o '结论：[^<]*' | head -1)
          echo "页面结论: ${stamp:-<空>}"
          case "$stamp" in
            结论：PASS*) ;;
            *)
              echo "::error::verify.html 未通过：${stamp:-无结论}"
              echo "--- 逐项结果 ---"
              echo "$out" | sed 's/<\/tr>/\n/g' | grep -E '>PASS<|>FAIL<|>WARN<'
              exit 1
              ;;
          esac

      - name: 连续性台账守门（哈希链 + 停更检测）
        run: |
          set -u
          python scripts/check_continuity.py

      - name: 零依赖复验入口（第三方 CI 视角）
        run: |
          set -u
          python3 scripts/verify_min.py --offline

      - name: fail-closed 自测（篡改必被抓住）
        run: |
          set -u
          python3 scripts/selftest_negative.py

      - name: DID 绑定（did:web 文档与主张公钥一致）
        run: |
          set -u
          python3 scripts/verify_min.py --offline --path . 2>&1 | grep -qE "^PASS .*DID 公钥 == CLAIMANT_PUBKEY.pem" || {
            echo "::error::DID 公钥与主张公钥不一致"; exit 1; }

      - name: 机器可读裁定（JSON 回执结构自检）
        run: |
          set -u
          python3 scripts/verify_min.py --offline --json > verdict.json
          python3 - <<'PY'
import json
v = json.load(open("verdict.json", encoding="utf-8"))
print("verdict =", v["verdict"], "| counts =", v["counts"])
assert v["schema"] == "uibc-ip-verify-receipt/1"
assert v["verdict"] == "PASS"
PY
