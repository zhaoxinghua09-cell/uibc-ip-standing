name: verify-commitments

on:
  push:
  pull_request:

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: 敏感信息预检（私钥/令牌/路径）
        run: |
          set -e
          if grep -rInE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}' \
             --exclude-dir=.git --exclude=scripts/preflight_scan.ps1 . ; then
            echo "::error::发现疑似私钥或令牌"; exit 1
          fi
      - name: 承诺件自检（哈希 + 签名 + 跨文件一致）
        run: python scripts/selfcheck.py
      - name: 浏览器复验页算法一致性（规范字节/指纹）
        run: node scripts/canon_check.js attest/CLAIM.json attest/CLAIM.json.sig attest/CLAIMANT_PUBKEY.pem
      - name: 复验页实际加载（无头浏览器跑一遍 verify.html）
        run: |
          set -u
          BIN=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$BIN" ]; then echo "::warning::本 runner 无 Chrome，跳过 verify.html 实跑"; exit 0; fi
          python -m http.server 8099 --bind 127.0.0.1 &
          SRV=$!
          sleep 2
          out=$($BIN --headless=new --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom http://127.0.0.1:8099/verify.html 2>/dev/null || true)
          kill $SRV 2>/dev/null || true
          echo "$out" | grep -q '结论：PASS' || { echo "::error::verify.html 未给出 PASS"; exit 1; }
          if echo "$out" | grep -q '结论：FAIL'; then echo "::error::verify.html 结论为 FAIL"; exit 1; fi
          echo "$out" | grep -o '结论：[^<]*' | head -1
